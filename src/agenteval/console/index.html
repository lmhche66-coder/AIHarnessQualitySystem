<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agenteval console</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <span class="brand">agenteval</span>
  <span class="dim">运行控制台</span>
  <span class="spacer"></span>
  <span class="dim" id="run-count">—</span>
  <button id="refresh" class="ghost" title="重新加载运行列表">
    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    刷新
  </button>
</header>
<main class="layout">
  <aside class="sidebar">
    <div class="section-title">运行</div>
    <ul id="run-list" class="run-list"></ul>
    <div id="run-empty" class="empty" hidden>还没有运行记录</div>
  </aside>
  <section class="detail" id="detail">
    <div class="empty">从左侧选择一次运行</div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
