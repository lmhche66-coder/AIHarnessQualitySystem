name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest

      - name: Record and replay contract cases
        run: |
          python -m agenteval --home .agenteval run \
            --cases examples/replayable_cases.json --demo \
            --cassette contract --cassette-mode record
          python -m agenteval --home .agenteval baseline --name contract
          python -m agenteval --home .agenteval run \
            --cases examples/replayable_cases.json --demo \
            --cassette contract --cassette-mode replay
          python -m agenteval --home .agenteval gate --name contract

      - name: Record and replay process cases
        run: |
          python -m agenteval --home .agenteval run \
            --cases examples/process_cases.json --demo \
            --cassette process --cassette-mode record
          python -m agenteval --home .agenteval baseline --name process
          python -m agenteval --home .agenteval run \
            --cases examples/process_cases.json --demo \
            --cassette process --cassette-mode replay
          python -m agenteval --home .agenteval gate --name process

      - name: Evaluate a stored trace
        run: |
          python -m agenteval --home .agenteval run \
            --cases examples/process_cases.json --demo
          python -m agenteval --home .agenteval trace save \
            --name checkout --case process-exact-sequence
          python -m agenteval --home .agenteval run \
            --cases examples/import_cases.json --demo --trace checkout
          python -m agenteval --home .agenteval gate --min-pass-rate 1.0 --max-errors 0

      - name: Run end-to-end tasks
        run: |
          python -m agenteval --home .agenteval task run \
            --tasks examples/tasks.json \
            --registry agenteval.fakes:build_task_registry \
            --agent examples/demo_agent.py:build_agent
          python -m agenteval --home .agenteval gate --min-pass-rate 1.0 --max-errors 0

      - name: Reflow a failure into a regression case
        run: |
          # 探针用例故意失败，失败本身是这一步的预期输入
          python -m agenteval --home .agenteval run \
            --cases examples/reflow_probe.json --demo || true
          python -m agenteval --home .agenteval triage \
            --emit /tmp/candidates.json --json > /tmp/triage.json
          python -c "import json; r=json.load(open('/tmp/triage.json')); assert r['total_failures'] == 1 and r['verified'] == 1, r"
          if python -m agenteval --home .agenteval run \
            --cases /tmp/candidates.json --demo > /dev/null; then
            echo "candidate no longer reproduces the original failure"
            exit 1
          fi
