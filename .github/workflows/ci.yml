name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: python -m pip install -e ".[dev,ui]"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install the UI driver
        run: python -m playwright install --with-deps chromium

      - name: Verify the console build is current
        run: |
          # 产物随包分发，因此必须与前端源码保持一致：重新构建后不应产生差异
          cd web
          npm ci
          npm run build
          cd ..
          git diff --exit-code -- src/agenteval/console/dist

      - name: Tests
        run: python -m pytest

      - name: Record and replay contract cases
        run: |
          python -m agenteval --home .agenteval run \
            --cases examples/replayable_cases.json --demo \
            --cassette contract --cassette-mode record
          python -m agenteval --home .agenteval baseline --name contract
          python -m agenteval --home .agenteval run \
            --cases examples/replayable_cases.json --demo \
            --cassette contract --cassette-mode replay
          python -m agenteval --home .agenteval gate --name contract

      - name: Record and replay process cases
        run: |
          python -m agenteval --home .agenteval run \
            --cases examples/process_cases.json --demo \
            --cassette process --cassette-mode record
          python -m agenteval --home .agenteval baseline --name process
          python -m agenteval --home .agenteval run \
            --cases examples/process_cases.json --demo \
            --cassette process --cassette-mode replay
          python -m agenteval --home .agenteval gate --name process

      - name: Evaluate a stored trace
        run: |
          python -m agenteval --home .agenteval run \
            --cases examples/process_cases.json --demo
          python -m agenteval --home .agenteval trace save \
            --name checkout --case process-exact-sequence
          python -m agenteval --home .agenteval run \
            --cases examples/import_cases.json --demo --trace checkout
          python -m agenteval --home .agenteval gate --min-pass-rate 1.0 --max-errors 0

      - name: Run end-to-end tasks
        run: |
          python -m agenteval --home .agenteval task run \
            --tasks examples/tasks.json \
            --registry agenteval.fakes:build_task_registry \
            --agent examples/demo_agent.py:build_agent
          python -m agenteval --home .agenteval gate --min-pass-rate 1.0 --max-errors 0

      - name: Reflow a failure into a regression case
        run: |
          # 探针用例故意失败，失败本身是这一步的预期输入
          python -m agenteval --home .agenteval run \
            --cases examples/reflow_probe.json --demo || true
          python -m agenteval --home .agenteval triage \
            --emit /tmp/candidates.json --json > /tmp/triage.json
          python -c "import json; r=json.load(open('/tmp/triage.json')); assert r['total_failures'] == 1 and r['verified'] == 1, r"
          if python -m agenteval --home .agenteval run \
            --cases /tmp/candidates.json --demo > /dev/null; then
            echo "candidate no longer reproduces the original failure"
            exit 1
          fi

      - name: Import an external agent audit
        run: |
          python -m agenteval --home .agenteval trace import \
            --from examples/kingfar_audit.json \
            --name kingfar-eeg-sample-loss \
            --case-id task-eeg-sample-loss
          python -m agenteval --home .agenteval run \
            --cases examples/kingfar_cases.json --demo
          python -m agenteval --home .agenteval gate --min-pass-rate 1.0 --max-errors 0

      - name: Calibrate a judge
        run: |
          python -m agenteval judge calibrate \
            --gold examples/judge_gold.json \
            --judge examples/demo_judges.py:build_keyword_judge
          if python -m agenteval judge calibrate \
            --gold examples/judge_gold.json \
            --judge examples/demo_judges.py:build_position_biased_judge > /dev/null; then
            echo "a position-biased judge must not be usable for the gate"
            exit 1
          fi

      - name: Measure pass@k with repeated attempts
        run: |
          python -m agenteval --home .agenteval task run \
            --tasks examples/flaky_task.json \
            --registry agenteval.fakes:build_task_registry \
            --agent examples/demo_agent.py:build_flaky_agent

      - name: Load test a mock agent endpoint
        run: |
          python examples/mock_agent_endpoint.py 8799 &
          sleep 1
          python -m agenteval --home .agenteval load run \
            --scenarios examples/load_scenarios.json \
            --base-url http://127.0.0.1:8799

      - name: Probe an agent for security failures
        run: |
          # 有漏洞的目标必须被检出，有护栏的目标必须通过
          if python -m agenteval --home .agenteval redteam run \
            --probes examples/redteam_probes.json \
            --target examples/demo_redteam_targets.py:build_vulnerable_target; then
            echo "the vulnerable target must not pass the red team probes"
            exit 1
          fi
          python -m agenteval --home .agenteval redteam run \
            --probes examples/redteam_probes.json \
            --target examples/demo_redteam_targets.py:build_guardrail_target

      - name: Run a multi-turn dialogue
        run: |
          # 先问后做的 agent 必须通过，贸然动手的 agent 必须被检出
          if python -m agenteval --home .agenteval dialogue run \
            --cases examples/dialogue_cases.json \
            --agent examples/demo_dialogue_agent.py:build_hasty_agent \
            --registry agenteval.fakes:build_demo_registry; then
            echo "the hasty agent must fail the clarification check"
            exit 1
          fi
          python -m agenteval --home .agenteval dialogue run \
            --cases examples/dialogue_cases.json \
            --agent examples/demo_dialogue_agent.py:build_agent \
            --registry agenteval.fakes:build_demo_registry

      - name: Verify an MCP server's contract
        run: |
          # 正确的 server 必须通过，schema 与行为不一致的 server 必须被检出
          python -m agenteval --home .agenteval mcp run --cases examples/mcp_cases.json
          if python -m agenteval --home .agenteval mcp run \
            --cases examples/mcp_flaky_cases.json; then
            echo "the schema-mismatch server must not pass the MCP contract cases"
            exit 1
          fi

      - name: Score tool selection
        run: python -m agenteval --home .agenteval selection run --cases examples/selection_cases.json

      - name: Evaluate agents over the bridge
        run: |
          # 子进程 agent：注册表驱动，端到端任务必须全部解决
          python -m agenteval --home .agenteval --agents examples/agents.json task run \
            --tasks examples/tasks.json \
            --registry agenteval.fakes:build_task_registry \
            --agent @ledger-agent
          # 选错工具的 agent 必须被检出
          if python -m agenteval --home .agenteval --agents examples/agents.json selection run \
            --cases examples/selection_cases.json \
            --agent @rogue-agent; then
            echo "the rogue selection agent must not pass"
            exit 1
          fi
          # HTTP agent：一个 endpoint 复用多轮对话链路
          python examples/agents/http_support_agent.py &
          BRIDGE_PID=$!
          sleep 2
          python -m agenteval --home .agenteval --agents examples/agents.json dialogue run \
            --cases examples/dialogue_cases.json \
            --registry agenteval.fakes:build_demo_registry \
            --agent @support-agent
          kill "$BRIDGE_PID"

      - name: Verify the sandbox driver against real Docker
        run: python -m pytest tests/test_sandbox.py -m docker

      - name: Check the console in a real browser
        run: |
          # 界面检查放在最后：前面各步已经把运行、结论与轨迹写进了 .agenteval
          python -m agenteval --home .agenteval serve --port 8000 &
          CONSOLE_PID=$!
          sleep 3
          python tools/check_console_layout.py http://127.0.0.1:8000
          python -m agenteval --home .agenteval ui run --flows examples/ui_flows.json
          kill "$CONSOLE_PID"
