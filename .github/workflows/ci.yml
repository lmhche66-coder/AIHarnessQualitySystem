name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest

      - name: Record and replay contract cases
        run: |
          python -m agenteval --home .agenteval run \
            --cases examples/replayable_cases.json --demo \
            --cassette contract --cassette-mode record
          python -m agenteval --home .agenteval baseline --name contract
          python -m agenteval --home .agenteval run \
            --cases examples/replayable_cases.json --demo \
            --cassette contract --cassette-mode replay
          python -m agenteval --home .agenteval gate --name contract

      - name: Record and replay process cases
        run: |
          python -m agenteval --home .agenteval run \
            --cases examples/process_cases.json --demo \
            --cassette process --cassette-mode record
          python -m agenteval --home .agenteval baseline --name process
          python -m agenteval --home .agenteval run \
            --cases examples/process_cases.json --demo \
            --cassette process --cassette-mode replay
          python -m agenteval --home .agenteval gate --name process

      - name: Evaluate a stored trace
        run: |
          python -m agenteval --home .agenteval run \
            --cases examples/process_cases.json --demo
          python -m agenteval --home .agenteval trace save \
            --name checkout --case process-exact-sequence
          python -m agenteval --home .agenteval run \
            --cases examples/import_cases.json --demo --trace checkout
          python -m agenteval --home .agenteval gate --min-pass-rate 1.0 --max-errors 0
